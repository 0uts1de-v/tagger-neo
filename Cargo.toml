[package]
name = "tagger-neo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast native dataset tag editor with WD14 tagging"
license = "GPL3"

[dependencies]
anyhow = "1.0"
csv = "1.2"
eframe = { version = "0.22.0", features = ["persistence"] }
image = { version = "0.24.7", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
regex = "1.9"
reqwest = { version = "0.11.20", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.11.4"
ort = { version = "=2.0.0-rc.13", features = ["directml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser"] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = "thin"
strip = true
