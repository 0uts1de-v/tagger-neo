name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.88.0-x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = $env:GITHUB_WORKSPACE
          $dist = Join-Path $workspace "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exe = Join-Path $workspace "target\release\tagger-neo.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "tagger-neo.exe was not produced"
          }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $dist "tagger-neo.exe")

          # ort-sys may leave DirectML.dll as a symlink. Always copy the
          # resolved DLL contents into the ZIP so it works after extraction.
          $dllPath = Join-Path $workspace "target\release\DirectML.dll"
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "DirectML.dll was not produced"
          }
          $dll = Get-Item -LiteralPath $dllPath -Force
          $dllSource = $dll.FullName
          if ($dll.LinkType -eq "SymbolicLink") {
            $dllSource = $dll.Target
            if (-not [IO.Path]::IsPathRooted($dllSource)) {
              $dllSource = Join-Path $dll.DirectoryName $dllSource
            }
            $dllSource = (Resolve-Path -LiteralPath $dllSource).Path
          }
          Copy-Item `
            -LiteralPath $dllSource `
            -Destination (Join-Path $dist "DirectML.dll") `
            -Force

          $packagedDll = Get-Item -LiteralPath (Join-Path $dist "DirectML.dll")
          if ($packagedDll.Length -lt 1MB) {
            throw "DirectML.dll is unexpectedly small"
          }

          Copy-Item -LiteralPath (Join-Path $workspace "README.md") -Destination $dist
          Copy-Item -LiteralPath (Join-Path $workspace "LICENSE") -Destination $dist

          $packageFiles = @(Get-ChildItem -LiteralPath $dist -File)
          if ($packageFiles.Count -ne 4) {
            throw "The package must contain exactly exe, DLL, README.md, and LICENSE"
          }

          $tag = $env:GITHUB_REF_NAME
          $zipName = "tagger-neo-$tag-windows-x64.zip"
          $zip = Join-Path $workspace $zipName
          Compress-Archive `
            -Path (Join-Path $dist "*") `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" |
            Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Join-Path $env:GITHUB_WORKSPACE "tagger-neo-$tag-windows-x64.zip"
          $sha = "$zip.sha256"
          gh release create `
            $tag `
            $zip `
            $sha `
            --verify-tag `
            --generate-notes `
            --title "tagger-neo $tag"
